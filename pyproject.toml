[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-leyes-chile"
version = "0.2.0"
description = "Servidor MCP de leyes chilenas con cita verificable y documentos .odt/.pdf"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=2,<3", "lxml>=5", "PyYAML>=6"]

[project.scripts]
mcp-leyes-chile = "mcp_leyes.__main__:main"

[tool.setuptools]
packages = ["mcp_leyes"]
