id: arancel-23
tramite: Por la concurrencia al otorgamiento de un instrumento público o certificación
  de una firma…
para_que: Acto notarial con derecho maximo fijado por el arancel.
requisitos: []
documentos: []
arancel:
  norma: Decreto 587 Exento, 1998 (idNorma 127917)
  numeral: '23'
  texto_nominal: 'Por la concurrencia al otorgamiento de un

    instrumento público o certificación de una firma fuera de

    su oficina, hasta $5.000.-, además de los derechos que

    correspondan al otorgamiento o certificación; y si ello

    ocurriere en horas comprendidas entre las 20:00 y las 08:00,

    o en día inhábil, el arancel será convencional.'
  advertencia: 'Monto nominal de 1998. NO es el precio actual: el decreto no trae
    clausula de reajuste en su texto. Confirmar en la notaria.'
